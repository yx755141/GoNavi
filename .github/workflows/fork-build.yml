name: Fork Build (Windows AMD64)

on:
  push:
    branches:
      - dev-yx755141-20260715fix1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache frontend node_modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Wails
        run: go install -v github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build frontend dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/dist
          printf '<!doctype html><title>GoNavi</title>\n' > frontend/dist/index.html
          wails generate module
          node frontend/scripts/wails-frontend-install.mjs
          npm --prefix frontend run build

      - name: Generate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y%m%d)
          COUNT=$(gh release list --repo "${{ github.repository }}" --limit 50 2>/dev/null \
            | grep -c "^gonavi-${TODAY}-" || true)
          COUNT=$((COUNT + 1))
          RELEASE_TAG="gonavi-${TODAY}-${COUNT}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TODAY}.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "📌 Release: ${RELEASE_TAG}"

      - name: Install UPX
        shell: pwsh
        run: choco install upx --yes --no-progress

      - name: Build GoNavi
        shell: bash
        run: |
          set -euo pipefail
          DEV_VERSION="${{ steps.version.outputs.version }}"
          wails build -s -skipbindings -platform windows/amd64 -clean -o gonavi.exe -ldflags "-s -w -X GoNavi-Wails/internal/app.AppVersion=${DEV_VERSION}"

      - name: Compress binary
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Compressing gonavi.exe..."
          upx --best --lzma build/bin/gonavi.exe -o build/bin/gonavi.exe 2>/dev/null || true
          ls -lh build/bin/gonavi.exe

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          echo "📦 Creating release: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            build/bin/gonavi.exe \
            --repo "${{ github.repository }}" \
            --title "${RELEASE_TAG}" \
            --notes "自动构建 from ${GITHUB_SHA}" \
            --prerelease
          echo "✅ https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"