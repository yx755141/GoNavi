name: Fork Build (Windows AMD64)

on:
  push:
    branches:
      - dev-yx755141-20260715fix1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache frontend node_modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Wails
        run: go install -v github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build frontend dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/dist
          printf '<!doctype html><title>GoNavi</title>\n' > frontend/dist/index.html
          wails generate module
          node frontend/scripts/wails-frontend-install.mjs
          npm --prefix frontend run build

      - name: Generate version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEV_VERSION="dev-${SHORT_SHA}"
          echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "📌 Version: ${DEV_VERSION}"

      - name: Build GoNavi
        shell: bash
        run: |
          set -euo pipefail
          DEV_VERSION="${{ steps.version.outputs.version }}"
          wails build -s -skipbindings -platform windows/amd64 -clean -o gonavi.exe -ldflags "-s -w -X GoNavi-Wails/internal/app.AppVersion=${DEV_VERSION}"

      - name: Create Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TAG="dev-build"
          echo "📦 Creating/updating release: ${RELEASE_TAG}"
          # delete existing release and tag (if any)
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          # create new release
          gh release create "${RELEASE_TAG}" \
            build/bin/gonavi.exe \
            --repo "${{ github.repository }}" \
            --title "Dev Build (${VERSION})" \
            --notes "自动构建 from ${GITHUB_SHA}" \
            --prerelease
          echo "✅ Release created: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"